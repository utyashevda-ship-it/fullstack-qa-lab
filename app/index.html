<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>QA Task Lab</title>
<style>body{font:18px system-ui;max-width:700px;margin:60px auto;padding:20px;background:#f2f5fa;color:#18304c}input,button{font:inherit;padding:10px}li{padding:12px;display:flex;gap:12px;align-items:center}li span{flex:1}button{cursor:pointer}#error{color:#b42318}</style>
<h1>QA Task Lab</h1><p>A local sandbox for UI, API and observability testing.</p>
<form id="form"><label for="title">Task title</label> <input id="title" maxlength="120" required><button>Add task</button></form>
<p id="error" role="alert"></p><ul id="tasks" aria-label="Tasks"></ul>
<script>
async function api(path, options={}) {
  const response = await fetch('/api/tasks' + path, options);
  if (!response.ok) throw new Error('Request failed: ' + response.status);
  return response.status === 204 ? null : response.json();
}
function showError(error) { document.querySelector('#error').textContent = error.message; }
async function load() {
  const tasks = await api(''); const list = document.querySelector('#tasks'); list.replaceChildren();
  for (const task of tasks) {
    const row = document.createElement('li'); row.dataset.testid = 'task';
    const check = document.createElement('input'); check.type='checkbox'; check.checked=task.done;
    check.setAttribute('aria-label', 'Complete ' + task.title);
    check.onchange = async () => { try { await api('/'+task.id, {method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({done:check.checked})}); await load(); } catch(e) {showError(e);} };
    const text = document.createElement('span'); text.textContent=task.title;
    const remove = document.createElement('button'); remove.textContent='Delete';
    remove.onclick = async () => { try {await api('/'+task.id,{method:'DELETE'});await load();}catch(e){showError(e);} };
    row.append(check,text,remove); list.append(row);
  }
}
document.querySelector('#form').onsubmit = async event => {
  event.preventDefault(); document.querySelector('#error').textContent='';
  try {await api('',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:document.querySelector('#title').value})});document.querySelector('#title').value='';await load();} catch(e){showError(e);}
};
load().catch(showError);
</script></html>
